<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מאתר שטיפות פז</title>
    <!-- Modern Font from Google -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#0d0f14">
</head>
<body>
    <div class="app-container">
        <!-- Update Banner -->
        <div id="update-banner" class="update-banner hidden">
            <span>גרסה חדשה זמינה!</span>
            <button id="update-btn" class="action-btn btn-sm">עדכן עכשיו</button>
        </div>

        <header class="glass-header">
            <div class="header-top">
                <div class="logo">
                    <h1>פז <span>Wash</span></h1>
                </div>
                <button id="install-btn" class="action-btn install-btn hidden">
                    <i class="fas fa-download"></i> התקן
                </button>
            </div>
            <p class="subtitle">מצא את שטיפת הרכבים הקרובה אליך.</p>
            <p class="subtitle" id="last-updated-text" style="font-size: 0.8rem; margin-top: 10px; color: var(--primary-color);"></p>
        </header>

        <main>
            <!-- Location Status Card -->
            <div id="status-card" class="card status-card">
                <div class="pulse-ring"></div>
                <h2 id="status-text">מאתר את המיקום שלך...</h2>
                <p id="status-subtext">אנא ודא ששירותי המיקום מופעלים.</p>
                <div id="retry-btn-container" class="hidden">
                    <button id="retry-btn" class="action-btn outline">נסה שוב</button>
                </div>
            </div>

            <!-- List of Stations -->
            <div class="stations-header hidden" id="stations-header">
                <h2>התחנות הקרובות ביותר</h2>
            </div>
            
            <ul id="stations-list" class="stations-list hidden">
                <!-- Stations will be injected here by app.js -->
            </ul>
        </main>
    </div>

    <!-- Icon Library for Waze Car Icon (FontAwesome snippet) -->
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <!-- Auto-generated stations data -->
    <script src="stations.js"></script>
    <script src="app.js"></script>
</body>
</html>
